version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Indian/Antananarivo
    # Wait a week after a release before proposing it, so a broken or
    # compromised publish has time to be caught.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are planned by hand (Vite 8, ESLint 10, React 19...).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 7 supports TypeScript < 5.6.
      - dependency-name: typescript
        versions: [">=5.6.0"]
      # Held until the Vite 8 upgrade: newer releases pull in @parcel/watcher.
      - dependency-name: sass
        versions: [">=1.73.0"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Indian/Antananarivo
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
