name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: the scan only reads the Git history.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan the Git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks CLI (MIT) rather than gitleaks-action, which is under a
      # proprietary licence and comments on pull requests by default.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # --redact keeps any secret value out of the job log.
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
