name: Dependency review

on:
  pull_request:
    branches: [main]

# Read-only token: the review reads the dependency graph through the API
# and reports in the job summary, without commenting on the pull request.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout needed: the action compares the base and head
      # dependency graphs through the GitHub API.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime
